<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reprodutor YouTube Avançado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #ef4444; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #dc2626; 
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #ef4444;
            width: 40px;
            height: 40px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8">

    <div class="w-full max-w-4xl flex flex-col gap-6">
        <!-- Header & Input -->
        <div class="glass-panel p-6 rounded-2xl shadow-xl flex flex-col gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-2xl sm:text-3xl font-bold text-white flex items-center justify-center sm:justify-start gap-3">
                    <svg class="w-8 h-8 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                    Reprodutor YouTube
                </h1>
                <p class="text-slate-400 mt-1 text-sm">Cole o link do vídeo abaixo para assistir sem distrações (resolve o Erro 153).</p>
            </div>

            <form id="url-form" class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="url-input" placeholder="Ex: https://www.youtube.com/watch?v=..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-colors text-white placeholder-slate-500">
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl px-6 py-3 transition-colors flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Assistir
                </button>
            </form>

            <div id="error-message" class="hidden text-red-400 text-sm bg-red-950/30 p-3 rounded-lg border border-red-900"></div>
        </div>

        <!-- Video Player Area -->
        <div id="video-container" class="glass-panel w-full aspect-video rounded-2xl shadow-2xl overflow-hidden relative flex items-center justify-center bg-black/50">
            <!-- Placeholder -->
            <div id="empty-state" class="flex flex-col items-center justify-center text-slate-500">
                <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                <p>O vídeo aparecerá aqui</p>
            </div>

            <!-- Loader -->
            <div id="loading-spinner" class="hidden absolute inset-0 flex items-center justify-center bg-slate-900/80 z-10">
                <div class="loader"></div>
            </div>

            <!-- Iframe Container -->
            <div id="player-wrapper" class="w-full h-full absolute inset-0"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('url-form');
            const inputField = document.getElementById('url-input');
            const errorMessage = document.getElementById('error-message');
            const emptyState = document.getElementById('empty-state');
            const loadingSpinner = document.getElementById('loading-spinner');
            const playerWrapper = document.getElementById('player-wrapper');

            function showError(msg) {
                errorMessage.textContent = msg;
                errorMessage.classList.remove('hidden');
            }

            function hideError() {
                errorMessage.classList.add('hidden');
            }

            function extractYouTubeID(url) {
                // Regex super robusta para pegar IDs de links normais, youtu.be e shorts
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : null;
            }

            function loadVideo(videoId) {
                emptyState.style.display = 'none';
                playerWrapper.innerHTML = ''; // Limpa o iframe anterior
                loadingSpinner.classList.remove('hidden');

                const iframe = document.createElement('iframe');
                iframe.id = 'youtube-player';
                iframe.className = 'w-full h-full';
                iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&showinfo=0&modestbranding=1`;
                iframe.title = 'YouTube video player';
                iframe.frameBorder = '0';
                iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                iframe.allowFullscreen = true;
                
                // === A MÁGICA QUE RESOLVE O ERRO 153 DE RODAR LOCAL ===
                iframe.referrerPolicy = "strict-origin-when-cross-origin";
                
                iframe.style.opacity = '0';

                playerWrapper.appendChild(iframe);

                iframe.onload = () => {
                    loadingSpinner.classList.add('hidden');
                    iframe.style.opacity = '1';
                    iframe.style.transition = 'opacity 0.5s ease';
                };
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                hideError();

                const url = inputField.value.trim();
                
                if (!url) {
                    showError("Por favor, insira um link.");
                    return;
                }

                const videoId = extractYouTubeID(url);

                if (videoId) {
                    loadVideo(videoId);
                } else {
                    showError("Não foi possível encontrar um ID de vídeo válido neste link. Verifique se é um link do YouTube.");
                }
            });

            // Toca o vídeo automaticamente assim que o link é colado no input
            inputField.addEventListener('paste', (e) => {
                setTimeout(() => {
                    const pastedUrl = inputField.value.trim();
                    const videoId = extractYouTubeID(pastedUrl);
                    if (videoId) {
                        hideError();
                        loadVideo(videoId);
                    }
                }, 100);
            });
        });
    </script>
</body>
</html>
